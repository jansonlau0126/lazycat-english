<!doctype html><html lang="zh-HK"><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.lhead{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0}
.x{width:30px;height:30px;color:#C9B8A8}
.prog{flex:1;display:flex;gap:5px}
.prog i{flex:1;height:14px;border-radius:99px;background:#F1E6DA}
.prog i.f{background:linear-gradient(90deg,#FFC46B,var(--orange));box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.prog i.c{background:linear-gradient(90deg,#FFC46B 0,var(--orange) 50%,#F1E6DA 50%)}
.hearts{font:800 16px Nunito;color:#F0616B;display:flex;gap:3px;align-items:center}
main{gap:13px;padding-top:2px;overflow:visible}
.tag{display:flex;justify-content:space-between;align-items:center;margin-bottom:-38px;padding-right:118px}
.wordcard{position:relative;padding:16px 16px 14px;margin-top:40px}
.peek{position:absolute;right:18px;top:-50px;transform:rotate(4deg);z-index:2}
.peek .cphoto{box-shadow:0 0 0 4px #fff,0 6px 14px rgba(150,95,50,.28)}
.peek .say{position:absolute;left:-58px;top:10px;background:#fff;border:2px solid var(--line);border-radius:12px 12px 4px 12px;padding:3px 8px;font:800 12px/1.2 Nunito;color:var(--orange-d);transform:rotate(-4deg);white-space:nowrap}
.top{display:flex;gap:14px;align-items:center}
.icon{width:96px;height:96px;border-radius:26px;background:linear-gradient(160deg,#FFE9E4,#FFD3CB);display:flex;align-items:center;justify-content:center;font-size:58px;border:2px solid #FFD0C6;flex-shrink:0}
.wd{font:800 42px/1 "Baloo 2";letter-spacing:.3px;margin-top:4px}
.ipa{font:600 17px "Noto Sans","Nunito",sans-serif;color:var(--muted);margin:2px 0 6px}
.audio{display:flex;gap:8px;margin-top:14px}
.ab{height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-family:"Huninn";flex:1;background:var(--sky-l);color:#3B89B3;box-shadow:0 3px 0 #BFE2F3}
.ab .emoji{font-size:18px}
.meaning{display:flex;align-items:baseline;gap:10px;margin-top:14px;padding-top:12px;border-top:2px dashed var(--line)}
.meaning .zh{font-family:"Huninn";font-size:28px}
.sec{padding:11px 14px;border-radius:18px}
.sec h4{font-family:"Huninn";font-weight:normal;font-size:13px;display:flex;align-items:center;gap:5px;margin-bottom:4px}
.sec p{font-size:15px;line-height:1.5}
.ex .en2{font:700 17px/1.35 Nunito;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex mark{background:linear-gradient(transparent 55%,#FFD66B 55%);color:inherit;padding:0 1px}
.spk{width:32px;height:32px;border-radius:10px;background:var(--sky-l);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.tip p{font-size:14px;line-height:1.55}
.tip b{font:800 14px Nunito}
.foot{padding:12px 16px 30px;flex-shrink:0;border-top:2px solid var(--line);background:#fff}
</style>
<body><div class="phone" id="p"></div>
<script src="photos.js"></script><script src="common.js"></script>
<script>
document.getElementById('p').innerHTML = statusBar() + `
<div class="lhead">
 <svg class="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
 <div class="prog"><i class="f"></i><i class="f"></i><i class="f"></i><i class="c"></i><i></i></div>
 <span class="hearts"><i class="emoji">❤️</i>5</span>
</div>
<main>
 <div class="tag">
  <span class="pill" style="background:var(--sun-l);color:#B7801A">${foodIcon('food',18,'margin:-3px 0')} 食物 ・ 今日第 4 / 5 個字</span><span class="pill" style="background:var(--pink-l);color:#D0607D">新字</span>
  
 </div>
 <div class="card wordcard">
  <div class="peek">${catPhoto('orange',{w:80,h:80,mode:'face',r:'24px'})}</div>
  <div class="top">
   <div class="icon">${foodIcon('spicy',78)}</div>
   <div>
    <div class="wd">spicy</div>
    <div class="ipa">/ˈspaɪsi/</div>
    <span class="pill" style="background:var(--lav-l);color:var(--lav-d)">adj. 形容詞</span>
   </div>
  </div>
  <div class="audio">
   <div class="ab"><i class="emoji">🔊</i>聽發音</div>
   <div class="ab"><i class="emoji">🐢</i>慢速</div>
   <div class="ab" style="background:var(--mint-l);color:#3F9466;box-shadow:0 3px 0 #C3E9D3"><i class="emoji">🎤</i>跟讀</div>
  </div>
  <div class="meaning"><span class="zh">辣；辛辣</span><span style="font-size:13px;color:var(--muted)">中文意思</span></div>
 </div>
 <div class="sec" style="background:#fff;border:2px solid var(--line)">
  <h4>${catPhoto('orange',{w:18,mode:'face',cls:'ring2',style:'margin-right:2px'})}廣東話解釋</h4>
  <p>食落口熱辣辣、有辣椒嗰種刺激感覺。</p>
 </div>
 <div class="sec ex" style="background:var(--sky-l)">
  <h4 style="color:#3B89B3"><i class="emoji">💬</i>例句</h4>
  <div class="en2"><span>This curry is too <mark>spicy</mark> for me.</span><span class="spk emoji">🔊</span></div>
  <p style="font-size:14px;color:#6D8796;margin-top:2px">呢個咖喱對我嚟講太辣喇。</p>
 </div>
 <div class="sec tip" style="background:var(--sun-l)">
  <h4 style="color:#B7801A"><i class="emoji">💡</i>懶貓貼士：茶餐廳實用</h4>
  <p>走辣 → <b>No chilli, please.</b><br>少辣 → <b>Less spicy, please.</b><br>我唔食得辣 → <b>I can't eat spicy food.</b></p>
 </div>
</main>
<div class="foot"><div class="btn">明白喇，下一個 <span style="font-size:20px">→</span></div></div>`;
</script></body></html>
