<!doctype html><html lang="zh-HK"><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
html,body{width:3230px;height:1120px;background:linear-gradient(180deg,#FFF3E2,#FFE9D6)}
.wrap{padding:44px 50px}
.head{display:flex;align-items:center;gap:18px;margin-bottom:34px}
.head .logo{width:84px;height:84px;display:flex;align-items:center;justify-content:center}
.head h1{font-family:"Huninn";font-weight:normal;font-size:46px;color:#5B4636}
.head h1 span{color:#D9782A}
.head p{font-family:"Huninn";font-size:20px;color:#A48F80;margin-top:4px}
.head .cats{margin-left:auto;display:flex;gap:14px;padding-right:8px}
.row{display:flex;gap:36px;align-items:flex-start}
.item{display:flex;flex-direction:column;align-items:center;gap:16px}
.item img{border-radius:34px;box-shadow:0 0 0 8px #fff,0 18px 40px rgba(150,95,50,.22);display:block}
.item .cap{font-family:"Huninn";font-size:22px;color:#5B4636;display:flex;align-items:center;gap:10px}
.item .cap b{font:800 18px Nunito;background:#F59A3E;color:#fff;border-radius:99px;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
</style>
<body><div class="wrap">
<div class="head"><div class="logo" id="logo"></div><div><h1><span>懶貓英文</span>・每日五個字 — 設計概念 Mockups</h1><p>v2 ・ 真實大眼貓貓相 ＋ 手繪水彩食物 icon ・ 5 字/日 ・ 全年 52 週 1,200 字 ・ 15 隻貓貓圖鑑</p></div><div class="cats" id="cats"></div></div>
<div class="row">
 <div class="item"><img src="../01-home.png" width="390" height="844"><div class="cap"><b>1</b>首頁／今日</div></div>
 <div class="item"><img src="../02-word.png" width="390" height="844"><div class="cap"><b>2</b>學生字</div></div>
 <div class="item"><img src="../03-theme-card.png" width="390" height="844"><div class="cap"><b>3</b>主題生字卡</div></div>
 <div class="item"><img src="../04-cat-collection.png" width="390" height="844"><div class="cap"><b>4</b>貓貓圖鑑</div></div>
 <div class="item"><img src="../05-unlock-cat.png" width="390" height="844"><div class="cap"><b>5</b>解鎖新貓貓</div></div>
 <div class="item"><img src="../06-year-map.png" width="390" height="844"><div class="cap"><b>6</b>年度課程地圖</div></div>
 <div class="item"><img src="../vocab-card-food-export.png" width="563" height="844" style="border-radius:18px"><div class="cap"><b>7</b>生字卡匯出圖（1080×1620）</div></div>
</div></div>
<script src="photos.js"></script><script>
document.getElementById('logo').innerHTML=catPhoto('orange',{w:78,mode:'face'});
document.getElementById('cats').innerHTML=['british','black','american','calico','siamese','fold','munchkin','russian','chinchilla','ragdoll','mainecoon','sphynx','persian','bengal'].map(k=>catPhoto(k,{w:62,mode:'face'})).join('');
</script></body></html>
