<!doctype html><html lang="zh-HK"><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.bgscr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:120px;gap:14px;filter:blur(3px)}
.bgscr h1{font-family:"Huninn";font-weight:normal;font-size:28px;color:var(--orange-d)}
.bgscr .stats3{display:flex;gap:10px}
.bgscr .stats3 div{width:100px;height:80px;border-radius:18px;border:2px solid var(--line);background:#fff}
.dim{position:absolute;inset:0;background:rgba(74,52,38,.5)}
.modal{position:absolute;left:18px;right:18px;top:84px;background:#FFF8EE;border-radius:30px;padding:0 18px 20px;box-shadow:0 10px 0 #E7CBAE,0 20px 40px rgba(0,0,0,.25);text-align:center}
.ribbon{position:relative;margin:-22px auto 0;width:236px;height:48px;background:var(--coral);color:#fff;font-family:"Huninn";font-size:21px;display:flex;align-items:center;justify-content:center;border-radius:14px;box-shadow:0 5px 0 #E05A5F;letter-spacing:1px}
.ribbon:before,.ribbon:after{content:"";position:absolute;top:12px;width:26px;height:38px;background:#E05A5F;z-index:-1}
.ribbon:before{left:-16px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
.ribbon:after{right:-16px;clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}
.stage{position:relative;height:262px;margin:4px -18px 0;overflow:hidden}
.rays{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,214,107,.55) 0 10deg,rgba(255,214,107,0) 10deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 16%,transparent 46%);mask:radial-gradient(circle,#000 16%,transparent 46%)}
.glow{position:absolute;left:50%;top:50%;width:260px;height:220px;margin:-110px 0 0 -130px;border-radius:50%;background:radial-gradient(ellipse,#FFF4CC 0,rgba(255,244,204,0) 70%)}
.polaroid{position:absolute;left:50%;top:22px;width:286px;margin-left:-143px;background:#fff;border-radius:14px;padding:9px 9px 0;box-shadow:0 0 0 3px #FFE1A6,0 14px 26px rgba(160,100,50,.3);transform:rotate(-3deg)}
.polaroid .pframe{border-radius:9px}
.polaroid .pc{font-family:"Huninn";font-size:16px;padding:8px 0 9px;display:flex;justify-content:center;align-items:center;gap:7px;color:var(--cocoa)}
.polaroid .pc .n{font:800 12px Nunito;color:var(--orange-d);background:var(--orange-l);border-radius:99px;padding:2px 8px}
.tape{position:absolute;top:-10px;left:50%;margin-left:-38px;width:76px;height:22px;background:rgba(247,181,196,.75);transform:rotate(4deg);border-radius:3px}
.sp{position:absolute;font-size:22px}
.conf{position:absolute;width:9px;height:14px;border-radius:3px}
.title{font-family:"Huninn";font-size:28px;line-height:1.15;margin-top:2px}
.title small{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.quote{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:9px 14px;font-size:14.5px;line-height:1.5;color:#6B5444;margin-top:12px}
.quote:before{content:"";position:absolute;top:-10px;left:50%;margin-left:-9px;border:9px solid transparent;border-bottom-color:var(--line);border-top:0}
.quote:after{content:"";position:absolute;top:-7px;left:50%;margin-left:-8px;border:8px solid transparent;border-bottom-color:#fff;border-top:0}
.strip{display:flex;gap:7px;justify-content:center;margin:14px 0 4px}
.slot{position:relative}
.slot .pframe{box-shadow:0 0 0 2px #fff,0 2px 5px rgba(150,95,50,.2)}
.slot.new .pframe{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--orange),0 3px 8px rgba(150,95,50,.3)}
.slot .l{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(150,95,50,.25);display:flex;align-items:center;justify-content:center;font-size:12px}
.slot .nb{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--coral);color:#fff;font:900 8.5px/1 Nunito;padding:3px 5px;border-radius:99px;white-space:nowrap}
.slot.bonus .pframe{box-shadow:0 0 0 2px #fff,0 0 0 4px #CFC3F0}
.how{display:flex;gap:8px;justify-content:center;margin:12px 0 16px;flex-wrap:wrap}
.how .pill{font-size:12.5px;padding:5px 11px}
.btns{display:flex;flex-direction:column;gap:12px}
</style>
<body><div class="phone" id="p"></div>
<script src="photos.js"></script><script src="album.js"></script><script src="common.js"></script>
<script>
const paw = (c,s=15) => IC.paw.replace('<svg',`<svg style="width:${s}px;height:${s}px;color:${c}"`);
const conf=[[30,30,'#FF7A7A',20],[70,210,'#FFD66B',-30],[318,34,'#8FCBEA',15],[334,150,'#B7A6E6',40],[20,120,'#8FD6AE',-10],[300,226,'#F7B5C4',60],[110,8,'#8FD6AE',70],[262,6,'#FF7A7A',-50],[16,236,'#FFD66B',30],[346,240,'#FF7A7A',-20]];
const S = 52;
const slot = (k, st) => `<div class="slot ${st}">${poseImg(k,{w:S,h:S,r:'12px',cls:'nolabel '+(st==='lock'||st==='bonus'?'locked':'')})}${st==='lock'?'<span class="l emoji">🔒</span>':''}${st==='bonus'?'<span class="l emoji">🧶</span>':''}${st==='new'?'<span class="nb">NEW</span>':''}</div>`;
document.getElementById('p').innerHTML = statusBar() + `
<div class="bgscr"><h1>今日 5 個字學完！</h1><div class="stats3"><div></div><div></div><div></div></div></div>
<div class="dim"></div>
<div class="modal">
 <div class="ribbon"><i class="emoji" style="font-size:20px;margin-right:6px">📷</i>畫冊新相！</div>
 <div class="stage">
  <div class="rays"></div><div class="glow"></div>
  ${conf.map(([x,y,c,r])=>`<i class="conf" style="left:${x}px;top:${y}px;background:${c};transform:rotate(${r}deg)"></i>`).join('')}
  <span class="sp emoji" style="left:26px;top:70px">✨</span><span class="sp emoji" style="right:22px;top:92px;font-size:18px">✨</span>
  <div class="polaroid"><span class="tape"></span>${poseImg('stretch',{w:268,h:178,r:'9px'})}<div class="pc">③ 伸懶腰 <span class="n">3 / 4</span></div></div>
 </div>
 <div class="title">番薯伸咗個大懶腰！<small>多謝你陪番薯學咗 10 堂</small></div>
 <div class="quote">「伸完呢個懶腰，<br>就有力氣陪你學多 5 個字……先瞓。」</div>
 <div class="strip">${slot('sit','')}${slot('sleep','')}${slot('stretch','new')}${slot('happy','lock')}${slot('yarn','bonus')}</div>
 <div class="how">
  <span class="pill" style="background:var(--orange-l);color:var(--orange-d)"><i class="emoji">🐾</i> 陪讀 10 堂</span>
  <span class="pill" style="background:var(--sun-l);color:#B7801A"><i class="emoji">⭐</i> +20 XP</span>
  <span class="pill" style="background:var(--mint-l);color:#3F9466"><i class="emoji">📷</i> 畫冊 3 / 4</span>
 </div>
 <div class="btns">
  <div class="btn">睇番薯嘅畫冊 ${paw('#fff',20)}</div>
  <div class="btn ghost">繼續</div>
 </div>
</div>`;
</script></body></html>
