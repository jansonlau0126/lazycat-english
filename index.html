<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#58C80A">
<title>包仔英文・每日三個字</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥟</text></svg>">
<style>
:root{
  --green:#58C80A; --green-d:#46A302; --green-l:#D7FFB8; --green-t:#3F8F00;
  --blue:#1CB0F6; --blue-d:#1899D6; --blue-l:#DDF4FF;
  --red:#FF4B4B; --red-d:#E02E2E; --red-l:#FFDFE0;
  --orange:#FF9600; --orange-d:#E07F00;
  --gold:#FFC800; --gold-d:#E0A800;
  --purple:#B46CF0; --purple-d:#9449D6;
  --grey:#E5E5E5; --grey-d:#AFAFAF; --text:#3C3C3C; --muted:#8A8A8A; --bg:#FFFFFF;
  --font: "Nunito", "PingFang HK", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#F0F4EC;color:var(--text);font-family:var(--font)}
body{display:flex;justify-content:center}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{position:relative;width:100%;max-width:480px;height:100%;height:100dvh;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 30px rgba(0,0,0,.06)}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:2px solid var(--grey);background:#fff;z-index:5;flex-shrink:0}
.brand{display:flex;align-items:center;gap:6px;font-weight:900;font-size:17px;color:var(--green-t)}
.brand svg{width:34px;height:34px}
.stats{display:flex;gap:14px}
.stat{display:flex;align-items:center;gap:4px;font-weight:900;font-size:16px;padding:4px 6px;border-radius:10px}
.stat:active{background:#f3f3f3}
.stat .ic{font-size:20px}
.stat.streak{color:var(--orange)} .stat.streak.off{color:var(--grey-d);filter:grayscale(1)}
.stat.xp{color:var(--gold-d)} .stat.hearts{color:var(--red)}

/* ---------- main scroll ---------- */
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.page{padding:16px 16px 28px}

/* ---------- bottom nav ---------- */
.tabs{display:flex;border-top:2px solid var(--grey);background:#fff;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 8px;font-size:12px;font-weight:800;color:var(--grey-d);position:relative}
.tab .ti{font-size:24px;filter:grayscale(1);opacity:.6;transition:.15s}
.tab.active{color:var(--blue-d)}
.tab.active .ti{filter:none;opacity:1;transform:scale(1.08)}
.tab.active::before{content:"";position:absolute;inset:4px 10px;border:2px solid #84D8FF;background:var(--blue-l);border-radius:14px;z-index:-1}
.tab{z-index:0}
.tab .badge{position:absolute;top:4px;right:calc(50% - 26px);background:var(--red);color:#fff;border-radius:10px;font-size:11px;min-width:18px;padding:1px 5px;font-weight:900}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;padding:14px 16px;border-radius:16px;font-size:17px;font-weight:900;letter-spacing:.5px;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);transition:transform .06s, box-shadow .06s, filter .1s;text-align:center;user-select:none}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.orange{background:var(--orange);box-shadow:0 4px 0 var(--orange-d)}
.btn.purple{background:var(--purple);box-shadow:0 4px 0 var(--purple-d)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d);color:#6b4b00}
.btn.ghost{background:#fff;color:var(--blue-d);border:2px solid var(--grey);box-shadow:0 4px 0 var(--grey)}
.btn.ghost:active{box-shadow:0 0 0 var(--grey)}
.btn.plain{background:transparent;box-shadow:none;color:var(--blue-d)}
.btn:disabled,.btn.disabled{background:var(--grey);color:var(--grey-d);box-shadow:0 4px 0 #cfcfcf;pointer-events:none}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:12px;width:auto;display:inline-block}
.row{display:flex;gap:10px} .row>*{flex:1}

/* ---------- home ---------- */
.goal-card{display:flex;align-items:center;gap:12px;border:2px solid var(--grey);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.goal-card .gt{font-weight:900;font-size:15px}
.goal-card .gs{font-size:13px;color:var(--muted);margin-top:2px}
.bar{height:14px;background:var(--grey);border-radius:10px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:10px;transition:width .4s;position:relative}
.bar>i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:3px;background:rgba(255,255,255,.4)}
.bar.green>i{background:var(--green)}
.due-chip{display:flex;align-items:center;gap:10px;background:var(--blue-l);border:2px solid #84D8FF;color:var(--blue-d);font-weight:800;border-radius:16px;padding:10px 14px;margin-bottom:12px;font-size:14px;width:100%;text-align:left}
.unit{border-radius:18px;padding:14px 16px;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);margin:18px 0 34px;display:flex;align-items:center;gap:12px}
.unit .un{font-size:13px;font-weight:800;opacity:.9}
.unit .ut{font-size:19px;font-weight:900;margin-top:2px}
.unit .ue{font-size:34px;margin-left:auto}
.unit.c1{background:#58C80A;box-shadow:0 4px 0 #46A302}
.unit.c2{background:#1CB0F6;box-shadow:0 4px 0 #1899D6}
.unit.c3{background:#FF9600;box-shadow:0 4px 0 #E07F00}
.unit.c4{background:#B46CF0;box-shadow:0 4px 0 #9449D6}
.unit.c5{background:#FF6FA8;box-shadow:0 4px 0 #E0508A}
.unit.c0{background:#2EC4B6;box-shadow:0 4px 0 #1FA195}
.path{position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 0 10px}
.node-wrap{position:relative;height:92px;width:100%;display:flex;justify-content:center}
.node{position:absolute;top:8px;width:72px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--grey);box-shadow:0 7px 0 #CDCDCD;transition:transform .06s,box-shadow .06s;color:#fff}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 #CDCDCD}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d)}
.node.avail{background:var(--green);box-shadow:0 7px 0 var(--green-d)}
.node.avail.g, .node.done.g{background:var(--purple);box-shadow:0 7px 0 var(--purple-d)}
.node.avail.w, .node.done.w{background:var(--orange);box-shadow:0 7px 0 var(--orange-d)}
.node.avail.m, .node.done.m{background:#FF6FA8;box-shadow:0 7px 0 #E0508A}
.node.avail.r, .node.done.r{background:var(--blue);box-shadow:0 7px 0 var(--blue-d)}
.node.done::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--green-d);font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid var(--grey)}
.node.locked{filter:grayscale(1);opacity:.75}
.node.locked .ni{opacity:.55}
.node.big{width:86px;height:78px;font-size:38px}
.node.current::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:5px solid #D7F5C0;pointer-events:none}
.node.current.g::before{border-color:#EBD4FF}.node.current.w::before{border-color:#FFE0B3}.node.current.m::before{border-color:#FFD3E5}.node.current.r::before{border-color:#C8ECFF}
.node.sleep{background:#C9D6E3;box-shadow:0 7px 0 #A9B7C6;filter:none;opacity:1}
.start-bubble{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--grey);color:var(--green-d);font-weight:900;font-size:13px;padding:5px 10px;border-radius:12px;white-space:nowrap;animation:bob 1.2s ease-in-out infinite;z-index:2;pointer-events:none}
.start-bubble::after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-6px;width:10px;height:10px;background:#fff;border-right:2px solid var(--grey);border-bottom:2px solid var(--grey);transform:rotate(45deg)}
.start-bubble.sleepy{color:#6A7C8F}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
.path-mascot{position:absolute;width:96px;height:96px;pointer-events:none}
.pop{position:absolute;z-index:4;width:280px;left:50%;margin-left:-140px;background:var(--green);color:#fff;border-radius:18px;padding:14px;box-shadow:0 6px 0 var(--green-d);animation:popin .15s ease-out}
.pop.g{background:var(--purple);box-shadow:0 6px 0 var(--purple-d)} .pop.w{background:var(--orange);box-shadow:0 6px 0 var(--orange-d)}
.pop.m{background:#FF6FA8;box-shadow:0 6px 0 #E0508A} .pop.r{background:var(--blue);box-shadow:0 6px 0 var(--blue-d)}
.pop.locked{background:#F7F7F7;color:var(--muted);box-shadow:0 0 0 2px var(--grey) inset,0 6px 0 var(--grey)}
.pop h4{margin:0 0 4px;font-size:17px;font-weight:900}
.pop p{margin:0 0 12px;font-size:14px;opacity:.95;line-height:1.45}
.pop .btn{background:#fff;color:var(--green-d);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.pop.g .btn{color:var(--purple-d)} .pop.w .btn{color:var(--orange-d)} .pop.m .btn{color:#E0508A} .pop.r .btn{color:var(--blue-d)}
.pop .arrow{position:absolute;top:-8px;left:50%;margin-left:-8px;width:16px;height:16px;background:inherit;transform:rotate(45deg);border-radius:3px}
@keyframes popin{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.finish-flag{text-align:center;color:var(--muted);font-weight:800;padding:18px 0 30px}

/* ---------- lesson overlay ---------- */
.lesson{position:absolute;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column}
.lhead{display:flex;align-items:center;gap:12px;padding:14px 16px 8px}
.xbtn{font-size:26px;color:var(--grey-d);width:32px;line-height:1;font-weight:700}
.lprog{flex:1;height:16px;background:var(--grey);border-radius:10px;overflow:hidden}
.lprog>i{display:block;height:100%;width:0;background:var(--green);border-radius:10px;transition:width .35s;position:relative}
.lprog>i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:3px;background:rgba(255,255,255,.35)}
.lhearts{font-weight:900;color:var(--red);font-size:17px;display:flex;align-items:center;gap:3px}
.lbody{flex:1;overflow-y:auto;padding:8px 18px 20px;display:flex;flex-direction:column}
.lfoot{padding:14px 16px 20px;border-top:2px solid var(--grey);background:#fff;position:relative}
.qtype{font-size:13px;font-weight:900;color:var(--purple-d);letter-spacing:.5px;margin:6px 0 4px;display:flex;align-items:center;gap:6px}
.qtitle{font-size:22px;font-weight:900;margin:0 0 14px;line-height:1.35}
.speech{display:flex;align-items:flex-start;gap:8px;margin:4px 0 18px}
.speech svg{width:92px;height:92px;flex-shrink:0}
.bubble{position:relative;border:2px solid var(--grey);border-radius:16px;padding:12px 14px;font-size:18px;font-weight:800;margin-top:12px;line-height:1.4}
.bubble::before{content:"";position:absolute;left:-9px;top:20px;width:14px;height:14px;background:#fff;border-left:2px solid var(--grey);border-bottom:2px solid var(--grey);transform:rotate(45deg)}
.snd{display:inline-flex;align-items:center;justify-content:center;border-radius:16px;background:var(--blue);box-shadow:0 4px 0 var(--blue-d);color:#fff;font-size:26px;width:64px;height:58px}
.snd:active{transform:translateY(4px);box-shadow:none}
.snd.sm{width:42px;height:38px;font-size:18px;border-radius:12px;box-shadow:0 3px 0 var(--blue-d)}
.snd.turtle{background:#fff;color:var(--blue-d);border:2px solid var(--grey);box-shadow:0 3px 0 var(--grey)}
.snd.big{width:120px;height:100px;font-size:48px;border-radius:24px;box-shadow:0 6px 0 var(--blue-d)}
.snd.mic{background:var(--red);box-shadow:0 3px 0 var(--red-d)}
.snd.mic.rec{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:10px;padding:14px 14px;border:2px solid var(--grey);border-bottom-width:4px;border-radius:16px;font-size:17px;font-weight:800;background:#fff;text-align:left;transition:.08s}
.opt:active{transform:translateY(2px)}
.opt .k{width:26px;height:26px;border:2px solid var(--grey);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--grey-d);flex-shrink:0}
.opt.sel{border-color:#84D8FF;background:var(--blue-l);color:var(--blue-d)}
.opt.sel .k{border-color:#84D8FF;color:var(--blue-d)}
.opt.right{border-color:#A5ED6E;background:var(--green-l);color:var(--green-t)}
.opt.wrong{border-color:#FFB2B2;background:var(--red-l);color:var(--red-d)}
.opts.lock .opt{pointer-events:none}
.sentence{font-size:21px;font-weight:800;line-height:1.5;margin:4px 0 6px}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--grey-d);color:var(--blue-d);text-align:center}
.hint{color:var(--muted);font-size:15px;margin-bottom:18px;font-weight:600}
.answer-line{min-height:120px;border-top:2px solid var(--grey);border-bottom:2px solid var(--grey);margin:8px 0 22px;padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:repeating-linear-gradient(transparent 0 58px, var(--grey) 58px 60px)}
.answer-line.spell{min-height:70px;background:none;justify-content:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{padding:10px 14px;border:2px solid var(--grey);border-bottom-width:4px;border-radius:14px;font-size:18px;font-weight:800;background:#fff;min-width:44px;text-align:center}
.tile:active{transform:translateY(2px)}
.tile.used{background:var(--grey);color:var(--grey);border-color:var(--grey);pointer-events:none}
.tile.letter{min-width:46px;font-size:22px;padding:8px 0;width:46px}
.tinput{width:100%;font-size:20px;font-family:inherit;font-weight:800;padding:14px;border:2px solid var(--grey);border-radius:16px;background:#F7F7F7;outline:none;color:var(--text)}
.tinput:focus{border-color:#84D8FF;background:#fff}

/* feedback bar */
.fb{position:absolute;left:0;right:0;bottom:0;padding:16px 16px 20px;z-index:3;transform:translateY(100%);transition:transform .22s ease-out}
.fb.show{transform:translateY(0)}
.fb.ok{background:var(--green-l)} .fb.bad{background:var(--red-l)}
.fb .fh{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900;margin-bottom:6px}
.fb.ok .fh{color:var(--green-t)} .fb.bad .fh{color:var(--red-d)}
.fb .fi{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.fb .fd{font-size:15px;font-weight:700;margin:0 0 12px;line-height:1.45}
.fb.ok .fd{color:var(--green-t)} .fb.bad .fd{color:var(--red-d)}
.fb.bad .btn{background:var(--red);box-shadow:0 4px 0 var(--red-d)}

/* learn card */
.lcard{border:2px solid var(--grey);border-radius:22px;padding:18px 18px 16px;box-shadow:0 4px 0 var(--grey);position:relative}
.newtag{position:absolute;top:-12px;left:16px;background:var(--purple);color:#fff;font-weight:900;font-size:12px;padding:3px 10px;border-radius:10px}
.lword{font-size:38px;font-weight:900;color:var(--text);letter-spacing:.5px;margin-top:4px;word-break:break-word}
.lipa{font-size:18px;color:var(--muted);font-family:"Noto Sans", "DejaVu Sans","Lucida Sans Unicode","Segoe UI",sans-serif}
.lpos{display:inline-block;background:var(--blue-l);color:var(--blue-d);font-weight:900;font-size:13px;border-radius:8px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.lzh{font-size:24px;font-weight:900;color:var(--green-t);margin:12px 0 2px}
.lyue{font-size:15px;color:#555;line-height:1.5}
.lsec{margin-top:14px;padding-top:12px;border-top:2px dashed var(--grey)}
.lsec .lab{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:1px;margin-bottom:4px}
.lex{font-size:18px;font-weight:800;line-height:1.4}
.lex b{color:var(--blue-d)}
.lexzh{font-size:15px;color:#666;margin-top:2px}
.ltip{background:#FFF7D6;border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.5;color:#6b5400;margin-top:14px}
.lbtns{display:flex;gap:8px;align-items:center;margin-top:10px}
.mic-res{font-size:14px;font-weight:800;margin-top:8px;min-height:20px}

/* complete */
.complete{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 20px;position:relative;overflow:hidden}
.complete h2{font-size:28px;font-weight:900;color:var(--gold-d);margin:6px 0 4px}
.complete .sub{color:var(--muted);font-weight:700;margin-bottom:16px}
.cstats{display:flex;gap:10px;width:100%;margin:6px 0}
.cstat{flex:1;border:2px solid var(--gold);border-radius:16px;overflow:hidden}
.cstat .cl{background:var(--gold);color:#fff;font-size:12px;font-weight:900;padding:4px}
.cstat .cv{font-size:18px;font-weight:900;padding:10px 2px;color:var(--gold-d);white-space:nowrap}
.cstat.g{border-color:var(--green)} .cstat.g .cl{background:var(--green)} .cstat.g .cv{color:var(--green-d)}
.cstat.b{border-color:var(--blue)} .cstat.b .cl{background:var(--blue)} .cstat.b .cv{color:var(--blue-d)}
.learned{margin-top:14px;font-weight:800;color:var(--text);font-size:15px}
.learned span{display:inline-block;background:var(--green-l);color:var(--green-t);border-radius:10px;padding:3px 10px;margin:4px 3px 0}
.confetti{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(900px) rotate(720deg)}}
.celebrate svg{animation:hop .8s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* grammar intro */
.gcard{border:2px solid var(--grey);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 3px 0 var(--grey)}
.gcard h4{margin:0 0 6px;color:var(--purple-d);font-size:17px;font-weight:900}
.gcard p{margin:0;font-size:15px;line-height:1.6}
.gex{display:flex;gap:8px;align-items:center;margin-top:10px;background:#F7F7F7;border-radius:12px;padding:8px 10px}
.gex .ge{font-weight:800;font-size:15.5px} .gex .gz{font-size:13.5px;color:var(--muted)}

/* lists */
h2.pt{font-size:24px;font-weight:900;margin:4px 0 12px}
.hero{display:flex;align-items:center;gap:12px;border:2px solid var(--grey);border-radius:20px;padding:14px;margin-bottom:14px}
.hero svg{width:86px;height:86px;flex-shrink:0}
.hero .ht{font-size:19px;font-weight:900}
.hero .hs{font-size:14px;color:var(--muted);margin:4px 0 10px;font-weight:700}
.chips{display:flex;gap:8px;margin:8px 0 12px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:12px;border:2px solid var(--grey);font-weight:800;font-size:14px;background:#fff}
.chip.on{background:var(--blue-l);border-color:#84D8FF;color:var(--blue-d)}
.witem{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:2px solid #F2F2F2;width:100%;text-align:left}
.witem .ww{font-weight:900;font-size:17px}
.witem .wz{font-size:13.5px;color:var(--muted);font-weight:600}
.witem .wr{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.mastery{display:flex;gap:3px}
.mastery i{width:9px;height:14px;border-radius:3px;background:var(--grey)}
.mastery i.on{background:var(--gold)}
.duetag{font-size:11px;font-weight:900;color:#fff;background:var(--red);border-radius:8px;padding:1px 6px}
.lvl{font-size:11px;font-weight:800;color:var(--muted)}
.gitem{display:flex;align-items:center;gap:12px;border:2px solid var(--grey);border-radius:18px;padding:12px 14px;margin-bottom:10px;width:100%;text-align:left;box-shadow:0 3px 0 var(--grey)}
.gitem:active{transform:translateY(3px);box-shadow:none}
.gitem .ge{width:52px;height:52px;border-radius:16px;background:#F3E6FF;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.gitem .gt{font-weight:900;font-size:16px;line-height:1.3}
.gitem .gs{font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
.gitem .gst{margin-left:auto;font-size:13px;font-weight:900;flex-shrink:0}
.gitem.locked{opacity:.55} .gitem.locked .ge{filter:grayscale(1)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.sbox{border:2px solid var(--grey);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.sbox .si{font-size:26px} .sbox .sv{font-size:20px;font-weight:900} .sbox .sl{font-size:12.5px;color:var(--muted);font-weight:700}
.section-t{font-size:19px;font-weight:900;margin:18px 0 10px}
.cal{border:2px solid var(--grey);border-radius:18px;padding:12px}
.calh{display:flex;align-items:center;justify-content:space-between;font-weight:900;margin-bottom:8px}
.calh button{font-size:20px;color:var(--grey-d);padding:0 10px;font-weight:900}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calg .dw{font-size:12px;color:var(--muted);font-weight:800;padding-bottom:4px}
.calg .dd{height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px;font-weight:800;color:#666;position:relative}
.calg .dd.act{background:var(--orange);color:#fff}
.calg .dd.today{box-shadow:0 0 0 2px var(--blue) inset}
.calg .dd.act.today{box-shadow:0 0 0 3px #fff inset,0 0 0 2px var(--orange)}
.week-chart{display:flex;align-items:flex-end;gap:8px;height:120px;border:2px solid var(--grey);border-radius:18px;padding:12px 12px 8px}
.week-chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.week-chart .colb{width:100%;background:var(--gold);border-radius:6px 6px 3px 3px;min-height:3px}
.week-chart .colv{font-size:11px;font-weight:900;color:var(--gold-d)}
.week-chart .coll{font-size:12px;font-weight:800;color:var(--muted)}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goalopt{border:2px solid var(--grey);border-bottom-width:4px;border-radius:14px;padding:10px;text-align:left;font-weight:800}
.goalopt small{display:block;color:var(--muted);font-weight:700}
.goalopt.on{border-color:#84D8FF;background:var(--blue-l);color:var(--blue-d)}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:2px solid #F2F2F2;font-weight:800;gap:10px}
.setrow select{font-family:inherit;font-size:14px;padding:6px;border-radius:10px;border:2px solid var(--grey);max-width:200px}
.switch{width:52px;height:30px;border-radius:20px;background:var(--grey);position:relative;transition:.15s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--green)} .switch.on::after{left:25px}

/* modal */
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:20px 18px 24px;max-height:88%;overflow-y:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.modal h3{margin:0 0 6px;font-size:21px;font-weight:900;text-align:center}
.modal .mp{text-align:center;color:var(--muted);font-weight:700;margin:0 0 16px;line-height:1.5}
.modal .btn{margin-top:10px}
.mhearts{text-align:center;font-size:34px;letter-spacing:4px;margin:6px 0 4px}
.devbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.devbtns .btn{margin:0;font-size:14px;padding:12px 8px}
.devinfo{background:#F7F7F7;border-radius:12px;padding:10px;font-size:13px;font-family:monospace;margin-bottom:12px;line-height:1.6}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;z-index:100;animation:fade .2s;max-width:85%;text-align:center}
.devfab{position:absolute;right:12px;bottom:84px;z-index:10;width:44px;height:44px;border-radius:50%;background:#333;color:#fff;font-size:20px;box-shadow:0 3px 0 #000}
.empty{text-align:center;color:var(--muted);font-weight:700;padding:20px}

</style>

["tired","/ˈtaɪəd/","adj.","疲倦；攰","身體或者精神好攰，想唞下。","I feel tired after work.","放工之後我覺得好攰。","be tired of = 厭倦：I'm tired of waiting.（我等到厭晒）"],

["breakfast","/ˈbrekfəst/","n.","早餐","一日第一餐，即係早餐。","I have breakfast at seven.","我七點食早餐。","「食早餐」講 have breakfast，前面唔使加 the。"],

["weather","/ˈweðə/","n.","天氣","天氣，例如晴天、落雨、打風。","The weather is nice today.","今日天氣好好。","唔好同 whether（是否）搞亂，兩個字讀音差唔多。"],

["forget","/fəˈget/","v.","忘記；唔記得","唔記得某樣嘢或者某件事。","Don't forget your keys.","唔好唔記得帶鎖匙。","過去式係 forgot；forget to do = 唔記得去做某事。"],
["cheap","/tʃiːp/","adj.","便宜；平","價錢平、唔貴。","This shirt is very cheap.","呢件恤衫好平。","想講得客氣啲可以用 affordable（價錢相宜）。"],
["expensive","/ɪkˈspensɪv/","adj.","昂貴；貴","價錢高、好貴。","Hong Kong rent is expensive.","香港租金好貴。","比較級係 more expensive，唔係 expensiver。"],
["price","/praɪs/","n.","價錢","買嘢要俾幾多錢。","What is the price of this bag?","呢個袋幾多錢？","價錢用 high / low 形容：The price is high.（唔講 expensive price）"],
["order","/ˈɔːdə/","v.","點（菜）；訂購","喺餐廳叫嘢食，或者網上訂嘢。","Can I order a milk tea?","我可唔可以叫杯奶茶？","order food / order online（網購）；名詞：Can I take your order?（請問想點啲咩？）"],
["menu","/ˈmenjuː/","n.","菜單；餐牌","餐廳嘅餐牌；電腦嘅選單都叫 menu。","Can I see the menu, please?","可唔可以畀個餐牌我睇下？","on the menu = 餐牌上有：Is fish on the menu?"],
["bill","/bɪl/","n.","帳單","餐廳埋單張單，或者水電費單。","Can we have the bill, please?","唔該埋單。","美式英文埋單多數講 check；pay the bill = 俾錢。"],
["healthy","/ˈhelθi/","adj.","健康的","健康、對身體好。","She eats healthy food every day.","佢每日都食健康嘢。","反義詞係 unhealthy；stay healthy = 保持健康。"],
["exercise","/ˈeksəsaɪz/","v.","做運動","做運動；做名詞時亦可以解「練習題」。","I exercise three times a week.","我一個星期做三次運動。","名詞用法：do exercise / get some exercise（做運動）。"],
["sleep","/sliːp/","v.","睡覺；瞓覺","瞓覺、休息。","I need to sleep early tonight.","我今晚要早啲瞓。","過去式 slept；go to sleep = 入瞓；fall asleep = 瞓着咗。"],
["weekend","/ˌwiːkˈend/","n.","週末","週末，即係星期六同星期日。","What did you do at the weekend?","你週末做咗啲咩？","英式講 at the weekend，美式講 on the weekend。"],
["relax","/rɪˈlæks/","v.","放鬆","放鬆、唞下，唔好咁緊張。","I like to relax at home.","我鍾意喺屋企放鬆下。","relaxed 形容人覺得輕鬆；relaxing 形容嘢令人輕鬆。"],

["meeting","/ˈmiːtɪŋ/","n.","會議","開會、會議。","We have a meeting at ten.","我哋十點要開會。","開會 = have / hold a meeting；attend a meeting = 出席會議。"],
["email","/ˈiːmeɪl/","n.","電郵","電子郵件；亦可以做動詞：email someone。","Please send me an email.","請你寄封電郵畀我。","email 係元音開頭，所以講 an email。"],
["reply","/rɪˈplaɪ/","v.","回覆","覆人、回覆訊息。","Please reply to my email soon.","請盡快回覆我封電郵。","reply to + 人／訊息，唔好漏咗 to：reply to him。"],
["colleague","/ˈkɒliːg/","n.","同事","一齊返工嘅人，即係同事。","My colleague helps me a lot.","我同事幫咗我好多。","讀音似「call-leeg」，尾嗰個 -ue 唔發音。"],

["report","/rɪˈpɔːt/","n.","報告","報告；亦可以做動詞：匯報。","Please read this report first.","請你先睇咗呢份報告。","write a report = 寫報告；report to someone = 向某人匯報。"],
["appointment","/əˈpɔɪntmənt/","n.","預約","約好嘅時間，例如睇醫生、見客。","I have an appointment at three.","我三點有個預約。","make an appointment = 約時間；同朋友出街通常唔用呢個字。"],
["available","/əˈveɪləbl/","adj.","有空；可用的","得閒；或者有得用、有貨。","Are you available on Monday?","你星期一得唔得閒？","Are you available? 比 Are you free? 更正式，適合返工用。"],

["holiday","/ˈhɒlədeɪ/","n.","假期","放假；英式英文亦解作去旅行度假。","We are going on holiday next week.","我哋下個禮拜去度假。","go on holiday = 去度假；public holiday = 公眾假期。"],
["overtime","/ˈəʊvətaɪm/","adv.","超時工作","放工時間之後繼續做，即係「OT」。","I worked overtime last night.","我琴晚開 OT。","work overtime = 開 OT；overtime pay = OT 錢。"],

["solve","/sɒlv/","v.","解決","解決問題、解答難題。","Can you help me solve this?","你可唔可以幫我解決呢樣嘢？","solve a problem = 解決問題；solve a puzzle = 解謎。"],

["service","/ˈsɜːvɪs/","n.","服務","服務，例如餐廳、銀行提供嘅服務。","The service here is very good.","呢度服務好好。","service charge = 服務費（即係「加一」）。"],
["complain","/kəmˈpleɪn/","v.","投訴；抱怨","對唔滿意嘅嘢表示不滿。","Many people complain about the noise.","好多人投訴啲噪音。","complain about + 事；名詞係 complaint。"],

["passport","/ˈpɑːspɔːt/","n.","護照","出國旅行用嘅身份證明文件。","Please show me your passport.","請出示你嘅護照。","apply for a passport = 申請護照。"],

["nearby","/ˌnɪəˈbaɪ/","adv.","附近","喺附近、唔遠。","Is there a bank nearby?","附近有冇銀行？","nearby 可以放喺名詞前面（a nearby shop）或者句尾。"],

["borrow","/ˈbɒrəʊ/","v.","借（入）","由人哋度借嘢嚟用。","Can I borrow your pen?","我可唔可以借你支筆？","borrow = 借入；lend = 借出。borrow something from someone。"],
["lend","/lend/","v.","借（出）","將自己啲嘢借畀人用。","Can you lend me some money?","你可唔可以借啲錢畀我？","lend someone something；過去式係 lent。"],
["return","/rɪˈtɜːn/","v.","歸還；返回","還返畀人；或者返嚟、返去。","Please return the book on Monday.","請你星期一還返本書。","return 已經有「返」嘅意思，唔好講 return back。"],
["decide","/dɪˈsaɪd/","v.","決定","諗清楚之後揀定。","I can't decide what to eat.","我決定唔到食咩好。","decide to do：I decided to quit.；名詞係 decision。"],
["choose","/tʃuːz/","v.","選擇；揀","喺幾樣嘢入面揀一樣。","You can choose any colour.","你可以揀任何顏色。","過去式 chose，過去分詞 chosen。"],
["prefer","/prɪˈfɜː/","v.","比較喜歡","兩樣嘢之中比較鍾意其中一樣。","I prefer tea to coffee.","比起咖啡，我鍾意茶多啲。","prefer A to B（唔係 than）：I prefer tea to coffee."],

["practice","/ˈpræktɪs/","n.","練習","不斷做嚟令自己更熟練。","Practice makes perfect.","熟能生巧。","英式：practice 係名詞，practise 係動詞；美式兩樣都寫 practice。"],
["mistake","/mɪˈsteɪk/","n.","錯誤","錯處、做錯嘅嘢。","I made a mistake in the email.","我封電郵有個錯。","犯錯講 make a mistake，唔講 do a mistake。"],
["friendly","/ˈfrendli/","adj.","友善的","對人好、易相處。","Our neighbours are very friendly.","我哋啲鄰居好友善。","friendly 雖然係 -ly 結尾，但係形容詞，唔係副詞。"],
["polite","/pəˈlaɪt/","adj.","有禮貌的","講嘢做事有禮貌。","Please be polite to customers.","請對客人有禮貌。","反義詞：impolite / rude（冇禮貌）。"],
["honest","/ˈɒnɪst/","adj.","誠實的","講真話、唔呃人。","Thank you for being honest.","多謝你咁坦白。","h 唔發音，所以講 an honest person。"],
// ---- 第 4 週：職場進階 ----
["experience","/ɪkˈspɪəriəns/","n.","經驗；經歷","做過某啲嘢而累積嘅知識，或者一次經歷。","She has five years of experience.","佢有五年經驗。","解「經驗」時不可數；解「一次經歷」時可數：a great experience。"],
["skill","/skɪl/","n.","技能","識做某樣嘢嘅能力、技巧。","Cooking is a useful skill.","煮飯係一樣有用嘅技能。","communication skills = 溝通技巧（多數用複數）。"],
["confident","/ˈkɒnfɪdənt/","adj.","有信心的","相信自己做得到。","I feel confident about the test.","我對個測驗好有信心。","be confident about / in something；名詞係 confidence。"],
["opportunity","/ˌɒpəˈtjuːnəti/","n.","機會","做某件事嘅好時機。","This is a good opportunity for you.","呢個對你嚟講係個好機會。","take the opportunity = 把握機會。"],

/* ================= dates ================= */

    case "freepractice": startReview(false); break;
    case "filter": reviewFilter = d.f; renderTab(); break;
    case "word": wordModal(WORDS[+d.id]); break;
    case "grammar": if (!grammarUnlocked(+d.k)) { toast(`完成第 ${d.k * 7} 日課程就會解鎖 🔒`); return; } startGrammar(+d.k); break;
    case "goal": S.goal = +d.v; save(); renderTab(); toast(`每日目標：${d.v} XP`); break;
    case "sound": S.sound = !S.sound; save(); renderTab(); break;
    case "cal": calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + (+d.d), 1); renderTab(); break;
    case "mascot": tapCount++; clearTimeout(tapTimer); tapTimer = setTimeout(() => tapCount = 0, 1500); a.querySelector("svg").style.transform = "scale(.92)"; setTimeout(() => a.querySelector("svg").style.transform = "", 120); if (tapCount >= 5) { tapCount = 0; devModal(); } break;
    case "dev": devAction(d.d); break;
    // lesson
    case "quit": modal(`<div style="width:100px;height:100px;margin:0 auto">${mascot("sad")}</div><h3>真係要走？</h3><p class="mp">而家離開，今課嘅進度會冇咗㗎。</p><button class="btn" data-act="close">繼續學 💪</button><button class="btn plain" style="color:var(--red-d)" data-act="quitnow">離開</button>`); break;
    case "next": L.doneCount++; L.idx++; renderStep(); break;
    case "opt": if (L.checked) return; $$("#lesson .opt").forEach(b => b.classList.remove("sel")); a.classList.add("sel"); L.sel = +d.i; $("#lesson .lfoot .btn").disabled = false;
      { const e2 = L.cur.e; if (e2.t === "fill" || e2.t === "gmc") $("#blank").textContent = e2.opts[L.sel]; if (["listen", "reverse", "fill"].includes(e2.t)) TTS.speak(e2.opts[L.sel]); } break;
    case "tile": if (L.checked) return; L.chosen.push(+d.i); renderTiles(); break;
    case "untile": if (L.checked) return; L.chosen.splice(+d.j, 1); renderTiles(); break;
    case "m": onMatch(a); break;
    case "check": check(); break;
    case "continue": onContinue(); break;
    case "done": closeLesson(); break;
  }
});
document.addEventListener("change", e => { if (e.target.id === "voiceSel") { S.voice = e.target.value; save(); TTS.speak("Hello! Nice to meet you."); } });
document.addEventListener("keydown", e => {
  if (!L || $("#modal")) return; if (e.target.tagName === "INPUT") return;
  if (e.key === "Enter") { const b = $("#lesson .fb.show .btn") || $("#lesson .lfoot .btn:not([disabled])"); if (b) b.click(); }
  if (/^[1-4]$/.test(e.key)) { const o = $$("#lesson .opt[data-act='opt']")[+e.key - 1]; if (o) o.click(); }
});

/* ================= boot ================= */
TTS.init();
if (/[?&]dev=1/.test(location.search)) { const b = document.createElement("button"); b.className = "devfab"; b.textContent = "🛠"; b.addEventListener("click", devModal); $("#app").appendChild(b); }
render();
setInterval(() => { if (!L) { const before = S.hearts; refillHearts(); if (S.hearts !== before) renderTop(); } }, 30000);
window.BZ = { get L() { return L; }, get S() { return S; }, PATH, WORDS, GRAMMAR };   // test hook
})();

</script>
